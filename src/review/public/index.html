<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DOM 框问题核验</title>
  <link rel="stylesheet" href="review-assets/style.css">
</head>
<body>
  <header>
    <b>DOM 框问题核验</b><span id="summary"></span><span id="review-count"></span>
    <div class="muted">视觉框按 layer 着色；原始框为蓝 / 橙。红：已有框问题，绿：人工补框。坐标按原图保存。</div>
  </header>
  <main>
    <aside class="catalog">
      <input id="search" placeholder="筛选页面 / 来源" aria-label="筛选页面">
      <select id="review-filter" aria-label="筛选核验状态">
        <option value="all">全部页面</option><option value="issues">有问题记录</option>
        <option value="unreviewed">尚未全部检查</option><option value="reviewed">全部已检查</option>
      </select>
      <div id="jobs"></div>
    </aside>
    <section id="workspace">
      <div class="toolbar">
        <div id="sizes"></div>
        <div class="row">
          <button id="select-mode" class="active" type="button">选已有框</button>
          <button id="missing-mode" type="button">框选缺失</button>
          <select id="zoom" aria-label="缩放">
            <option value="fit">适应宽度</option><option value="1">100%</option>
            <option value="0.75">75%</option><option value="0.5">50%</option><option value="0.25">25%</option>
          </select>
          <button id="reviewed" type="button">标记已检查</button>
          <button id="reload" type="button">重新加载记录</button>
        </div>
        <div class="row">
          <select id="box-source" aria-label="框来源">
            <option value="visual">视觉层级（规则生成）</option><option value="raw">原始 DOM 全部框</option>
          </select>
          <label><input id="parent-box" type="checkbox" checked>显示选中框的父框</label>
        </div>
        <div id="hierarchy-info" class="muted"></div>
        <div class="row">
          <label><input id="boxes" type="checkbox" checked>自动框</label>
          <label><input id="annotations" type="checkbox" checked>问题标记</label>
          <label><input id="controls" type="checkbox">仅交互提示</label>
          <label><input id="texts" type="checkbox">有直接文字</label>
          <select id="tag" aria-label="筛选 tag"><option value="">全部 tag</option></select>
          <select id="struct-filter" aria-label="筛选 struct"><option value="">全部 struct</option></select>
          <select id="disposition-filter" aria-label="筛选标注用途">
            <option value="">全部用途</option><option value="detection">检测候选</option>
            <option value="structure_only">仅结构</option><option value="review">待审</option>
          </select>
        </div>
        <div id="message" class="muted"></div>
        <div id="mode-help" class="muted">点击图片中的框，重叠的框可在下拉列表中切换；也可从右侧节点列表选择。</div>
        <select id="hit-choices" aria-label="选择重叠框" hidden></select>
        <div id="status" role="status" aria-live="polite"></div>
        <button id="restart-review" type="button" hidden>为当前截图重新开始（旧记录将保留）</button>
      </div>
      <fieldset id="layer-controls">
        <legend>显示层级（可多选）</legend>
        <div class="row"><button id="layers-all" type="button">全选</button><button id="layers-none" type="button">全不选</button></div>
        <div id="layer-options" class="row"></div>
      </fieldset>
      <div id="stage" hidden>
        <img id="image" alt="采集网页截图" draggable="false">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </section>
    <aside id="inspect">
      <h3 id="editor-title">请选择已有框，或拖拽框选缺失区域</h3>
      <div id="selected-hierarchy" class="muted"></div>
      <button id="select-parent" type="button" hidden>选择父节点</button>
      <form id="issue-form">
        <label><span id="type-label">问题类型</span>
          <input id="issue-type" list="issue-types" maxlength="200" placeholder="可选择或自行输入">
        </label>
        <datalist id="issue-types">
          <option value="框位置不准确"></option><option value="框过小"></option><option value="框过大"></option>
          <option value="重复框"></option><option value="不应标注"></option><option value="tag 选择不合适"></option>
          <option value="层级不正确"></option><option value="缺失文字"></option><option value="缺失控件"></option>
          <option value="不应独立成层"></option><option value="父节点不正确"></option>
          <option value="缺失图片"></option><option value="缺失图标"></option><option value="缺失容器"></option><option value="其他"></option>
        </datalist>
        <label>错误原因 / 备注<textarea id="reason" rows="3" maxlength="4000" placeholder="已有框问题必须填写原因"></textarea></label>
        <label>内容描述<textarea id="content" rows="2" maxlength="4000" placeholder="缺失标记必须填写内容"></textarea></label>
        <label>期望标签 / tag（可选）<input id="expected-tag" maxlength="100" placeholder="例如 button、text、container"></label>
        <div class="muted">bbox：[x, y, width, height]，原图 CSS 像素</div>
        <div class="coordinates">
          <input id="box-x" aria-label="bbox x" type="number" step="0.1">
          <input id="box-y" aria-label="bbox y" type="number" step="0.1">
          <input id="box-width" aria-label="bbox width" type="number" step="0.1">
          <input id="box-height" aria-label="bbox height" type="number" step="0.1">
        </div>
        <div class="row"><button id="save-issue" class="primary" type="submit">保存问题</button><button id="clear-draft" type="button">清空选择</button></div>
      </form>
      <h3>已保存的问题 <span id="issue-count">0</span></h3>
      <div id="issues"></div>
      <details><summary>当前节点 / 框详情</summary><pre id="detail">未选择</pre></details>
      <details><summary>筛选后的 DOM 节点</summary><div id="nodes"></div></details>
    </aside>
  </main>
  <script type="module" src="review-assets/app.js"></script>
</body>
</html>
